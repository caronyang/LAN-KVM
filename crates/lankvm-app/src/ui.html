<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN-KVM</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121923;
    --panel2: #0e1520;
    --line: #243041;
    --text: #dbe6f3;
    --muted: #8ba0b8;
    --accent: #4cc2ff;
    --good: #39d98a;
    --warn: #ffcc66;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #101823, #0b0f14);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  header .sub { color: var(--muted); font-size: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); display: inline-block; margin-right: 6px; }
  .dot.on { background: var(--good); box-shadow: 0 0 8px #39d98a88; }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 22px 40px; max-width: 1280px; margin: 0 auto; }
  #globalBanner { max-width: 1280px; margin: 16px auto 0; padding: 0 22px; }
  #globalBanner:empty { display: none; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin: 0 0 12px; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #1b2634; }
  .row:last-child { border-bottom: 0; }
  .label { color: var(--muted); font-size: 12px; }
  .value { font-weight: 600; }
  button {
    background: #1b2838; color: var(--text); border: 1px solid #2c3d52;
    padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #0d3a52; border-color: #1b6c93; color: #bfeaff; }
  button.danger { border-color: #5a2a2a; color: #ffb3b3; }
  button.small { padding: 4px 9px; font-size: 12px; }
  button:disabled { opacity: .4; cursor: default; }
  select, input[type=number], input[type=text] {
    background: var(--panel2); border: 1px solid #2c3d52; color: var(--text);
    border-radius: 8px; padding: 6px 8px; font-size: 13px;
  }
  select.plain { padding: 4px 6px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #1b2634; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .7px; }
  tr:last-child td { border-bottom: 0; }
  .pill { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid #2c3d52; color: var(--muted); }
  .pill.good { color: var(--good); border-color: #1f6b47; }
  .pill.warn { color: var(--warn); border-color: #6b5520; }
  .pill.bad { color: var(--bad); border-color: #6b2b2b; }
  .muted { color: var(--muted); }
  .big-code {
    font: 700 42px/1.1 "Consolas", monospace; letter-spacing: 12px;
    color: var(--accent); text-align: center; padding: 16px 0 4px;
  }
  .banner { border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; border: 1px solid #2c3d52; background: #0e1a26; }
  .banner.good { border-color: #1f6b47; background: #0d2118; }
  .banner.bad { border-color: #6b2b2b; background: #241012; }
  .toast { position: fixed; right: 18px; bottom: 18px; background: #16222f; border: 1px solid #2c3d52; padding: 10px 14px; border-radius: 10px; opacity: 0; transition: .2s; }
  .toast.show { opacity: 1; }
  .modal-bg { position: fixed; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 20; }
  .modal-bg.show { display: flex; }
  .modal { width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  pre.logs { max-height: 180px; overflow: auto; background: var(--panel2); border: 1px solid #1b2634; border-radius: 8px; padding: 10px; font-size: 11px; color: #9fb3c8; white-space: pre-wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>LAN-KVM</h1>
  <span class="sub" id="hdrName" data-i18n="loading">載入中…</span>
  <span class="sub" id="hdrStatus"></span>
  <span style="flex:1"></span>
  <select id="lang" class="plain" title="Language / 語言">
    <option value="zh">中文</option>
    <option value="en">English</option>
  </select>
  <button class="small" onclick="scan()" data-i18n="rescan">重新掃描</button>
  <button class="small" onclick="collectLogs()" data-i18n="collectLogs">收集紀錄</button>
  <button class="small danger" onclick="quitApp()" data-i18n="quit">結束程式</button>
</header>

<div id="globalBanner"></div>

<main>
  <section style="display:flex;flex-direction:column;gap:16px">
    <div class="card">
      <h2 data-i18n="local">本機</h2>
      <div class="row"><span class="label" data-i18n="name">名稱</span><span class="value" id="ownName">-</span></div>
      <div class="row"><span class="label" data-i18n="role">角色</span><span class="value" id="ownRole">-</span></div>
      <div class="row"><span class="label" data-i18n="autoConnect">自動連線</span><span class="value" id="ownAuto">-</span></div>
      <div class="row"><span class="label" data-i18n="status">狀態</span><span class="value" id="ownState">-</span></div>
    </div>

    <div class="card">
      <h2 data-i18n="layoutThreshold">版面與門檻</h2>
      <div class="field">
        <label data-i18n="peerEdge">對方螢幕在我的</label>
        <select id="edge">
          <option value="right" data-i18n="edgeRight">右邊（我往右切過去）</option>
          <option value="left" data-i18n="edgeLeft">左邊（我往左切過去）</option>
        </select>
      </div>
      <div class="grid2">
        <div class="field"><label data-i18n="triggerPx">切入推力 px</label><input id="triggerPx" type="number" min="4" max="200" step="1"></div>
        <div class="field"><label data-i18n="triggerMs">時間窗 ms</label><input id="triggerMs" type="number" min="80" max="2000" step="10"></div>
      </div>
      <div class="field"><label data-i18n="releasePx">回切越界 px</label><input id="releasePx" type="number" min="1" max="100" step="1"></div>
      <div class="actions">
        <button class="primary" onclick="saveSettings()" data-i18n="saveSettings">儲存設定</button>
        <button onclick="togglePause()" id="pauseBtn" data-i18n="pause">暫停自動連線</button>
      </div>
      <p class="muted" style="font-size:12px;margin:10px 0 0" data-i18n="settingsHint">設定會在下次連線時套用。左右關係也可在這裡改，不需要改指令。</p>
    </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:16px">
    <div class="card">
      <h2 data-i18n="discovered">掃描到的電腦</h2>
      <table>
        <thead><tr><th data-i18n="name">名稱</th><th>IP</th><th data-i18n="status">狀態</th><th style="width:180px" data-i18n="actions">動作</th></tr></thead>
        <tbody id="peerRows"><tr><td colspan="4" class="muted" data-i18n="scanning">尚無資料，正在掃描…</td></tr></tbody>
      </table>
    </div>

    <div class="card" id="sessionCard" style="display:none">
      <h2 data-i18n="connection">連線</h2>
      <div class="row"><span class="label" data-i18n="peer">對象</span><span class="value" id="sessPeer">-</span></div>
      <div class="row"><span class="label" data-i18n="role">角色</span><span class="value" id="sessRole">-</span></div>
      <div class="row"><span class="label" data-i18n="time">時間</span><span class="value" id="sessTime">-</span></div>
      <div class="actions" style="margin-top:12px">
        <button class="danger" onclick="stopSession()" data-i18n="stopSession">停止連線</button>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="pairedTitle">已配對（開機自動連線）</h2>
      <table>
        <thead><tr><th data-i18n="name">名稱</th><th data-i18n="role">角色</th><th data-i18n="auto">自動</th><th style="width:200px" data-i18n="actions">動作</th></tr></thead>
        <tbody id="pairedRows"><tr><td colspan="4" class="muted" data-i18n="notPaired">尚未配對</td></tr></tbody>
      </table>
    </div>

    <div class="card">
      <h2 data-i18n="logs">紀錄</h2>
      <pre class="logs" id="logs">-</pre>
    </div>
  </section>
</main>

<div class="modal-bg" id="modal">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

let lang = (() => {
  const saved = localStorage.getItem("lankvm.lang");
  if (saved === "zh" || saved === "en") return saved;
  return (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
})();

function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) || I18N.zh[key] || key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}

function applyI18n() {
  document.documentElement.lang = lang === "en" ? "en" : "zh-Hant";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  const sel = document.getElementById("lang");
  if (sel) sel.value = lang;
  if (S) render();
}

document.getElementById("lang").addEventListener("change", e => {
  lang = e.target.value;
  localStorage.setItem("lankvm.lang", lang);
  applyI18n();
});

let S = null;
let busy = false;
let lastPairKey = "";

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
  return await res.json().catch(() => ({ ok: false, error: t("badResponse") }));
}

async function refresh() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    S = await res.json();
    render();
  } catch (e) {
    document.getElementById("hdrStatus").textContent = t("cannotReach");
  }
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function toast(msg) {
  const tEl = document.getElementById("toast");
  tEl.textContent = msg;
  tEl.classList.add("show");
  clearTimeout(tEl._h);
  tEl._h = setTimeout(() => tEl.classList.remove("show"), 2600);
}

function render() {
  const s = S;
  if (!s) return;
  document.getElementById("hdrName").textContent = `${s.name} · ${s.version}`;
  document.getElementById("ownName").textContent = s.name;
  document.getElementById("ownRole").textContent =
    (s.paired || []).some(p => p.role === "master") ? t("roleMaster") :
    (s.paired || []).some(p => p.role === "client") ? t("roleClient") : t("roleUnset");
  document.getElementById("ownAuto").textContent = s.paused ? t("autoPaused") : t("autoOn");
  document.getElementById("pauseBtn").textContent = s.paused ? t("resume") : t("pause");

  const online = (s.peers || []).filter(p => p.online).length;
  const sess = s.session;
  document.getElementById("ownState").textContent = sess
    ? (sess.role === "master"
        ? (online ? t("stateControlling") : t("stateWaitingPeer"))
        : t("stateControlled"))
    : (online ? t("stateIdleSeen", { n: online }) : t("stateIdle"));
  document.getElementById("hdrStatus").innerHTML = sess
    ? (online
        ? `<span class="dot on"></span>${t("hdrConnected")}`
        : `<span class="dot"></span>${t("hdrWaitingPeer")}`)
    : `<span class="dot ${online ? "on" : ""}"></span>${online ? t("hdrAvailable", { n: online }) : t("hdrScanning")}`;

  const edge = document.getElementById("edge");
  if (document.activeElement !== edge) edge.value = s.settings.edge;
  const tp = document.getElementById("triggerPx");
  if (document.activeElement !== tp) tp.value = Math.round(s.settings.trigger_px);
  const tm = document.getElementById("triggerMs");
  if (document.activeElement !== tm) tm.value = s.settings.trigger_ms;
  const rp = document.getElementById("releasePx");
  if (document.activeElement !== rp) rp.value = s.settings.release_px;

  renderPeers(s);
  renderPaired(s);
  renderSession(s);
  renderBanner(s);
  renderPairing(s);
  document.getElementById("logs").textContent =
    [...(s.logs || []), t("engineMarker"), ...(s.engine_log || [])].join("\n");
}

function renderPeers(s) {
  const tbody = document.getElementById("peerRows");
  const pairedIds = new Set((s.paired || []).map(p => p.id));
  const peers = s.peers || [];
  if (!peers.length) {
    const paired = s.paired || [];
    if (paired.length) {
      const names = paired.map(p => `<strong>${esc(p.name)}</strong>`).join(t("listSep"));
      tbody.innerHTML = `<tr><td colspan="4" class="muted">${t("peersPairedOffline", { names })}</td></tr>`;
    } else {
      tbody.innerHTML = `<tr><td colspan="4" class="muted">${t("peersNoData")}</td></tr>`;
    }
    return;
  }
  tbody.innerHTML = peers.map(p => {
    const paired = pairedIds.has(p.id);
    let pill = `<span class="pill good">${t("pillPaired")}</span>`;
    if (!paired) pill = `<span class="pill">${t("pillPairable")}</span>`;
    let actions = paired
      ? `<button class="small danger" onclick="unpair('${esc(p.id)}')">${t("unpair")}</button>`
      : `<button class="small primary" onclick="pair('${esc(p.id)}')">${t("pair")}</button>`;
    return `<tr>
      <td><strong>${esc(p.name)}</strong></td>
      <td class="muted">${esc(p.ip)}</td>
      <td>${pill}</td>
      <td>${actions}</td>
    </tr>`;
  }).join("");
}

function renderPaired(s) {
  const tbody = document.getElementById("pairedRows");
  const paired = s.paired || [];
  if (!paired.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="muted">${t("noneYet")}</td></tr>`;
    return;
  }
  tbody.innerHTML = paired.map(p => {
    const canConnect = p.role === "master";
    return `<tr>
      <td><strong>${esc(p.name)}</strong><div class="muted" style="font-size:11px">${esc(p.ip)}</div></td>
      <td>${p.role === "master" ? t("roleMasterShort") : t("roleClientShort")}</td>
      <td><label><input type="checkbox" ${p.auto_connect ? "checked" : ""} onchange="setAuto('${esc(p.id)}', this.checked)"> ${t("autoBoot")}</label></td>
      <td class="actions">
        ${canConnect ? `<button class="small primary" onclick="connectPeer('${esc(p.id)}')">${t("connectNow")}</button>` : ""}
        <button class="small danger" onclick="unpair('${esc(p.id)}')">${t("unpair")}</button>
      </td>
    </tr>`;
  }).join("");
}

function renderSession(s) {
  const card = document.getElementById("sessionCard");
  const sess = s.session;
  if (!sess) { card.style.display = "none"; return; }
  card.style.display = "";
  const peer = (s.paired || []).find(p => p.id === sess.peer_id);
  document.getElementById("sessPeer").textContent = peer ? `${peer.name} (${sess.peer_ip})` : sess.peer_ip;
  document.getElementById("sessRole").textContent = sess.role === "master"
    ? t("roleMasterShort")
    : (sess.uses_service ? t("sessClientService") : t("roleClientShort"));
  const sec = sess.uptime_secs;
  document.getElementById("sessTime").textContent =
    t("duration", { m: Math.floor(sec / 60), s: sec % 60 });
}

function renderBanner(s) {
  const el = document.getElementById("globalBanner");
  let html = "";
  if (!s.service_running) html += `<div class="banner bad">${t("svcNotReady")}</div>`;
  if (s.paused) {
    html += `<div class="banner">${t("autoPausedBanner")}</div>`;
  } else if (s.suppressed) {
    html += `<div class="banner">${t("suppressedBanner")}</div>`;
  }
  el.innerHTML = html;
}

function renderPairing(s) {
  const p = s.pairing;
  const modal = document.getElementById("modal");
  if (!p) { modal.classList.remove("show"); lastPairKey = ""; return; }
  const key = `${p.role}:${p.peer_id}:${p.code || ""}:${p.error || ""}`;
  if (key === lastPairKey && document.activeElement && document.activeElement.id === "codeInput") return;
  lastPairKey = key;
  modal.classList.add("show");

  if (p.role === "host") {
    document.getElementById("modalBody").innerHTML = `
      <h2 style="margin:0 0 4px;color:var(--text)">${t("pairingRequest")}</h2>
      <p class="muted">${t("pairingRequestHint", { name: esc(p.peer_name) })}</p>
      <div class="big-code">${esc(p.code || "---")}</div>
      <div class="actions" style="justify-content:flex-end;margin-top:14px">
        <button onclick="cancelPair()">${t("cancel")}</button>
      </div>`;
  } else {
    const err = p.error ? `<div class="banner bad" style="margin-top:10px">${esc(p.error)}</div>` : "";
    document.getElementById("modalBody").innerHTML = `
      <h2 style="margin:0 0 4px;color:var(--text)">${t("enterCode")}</h2>
      <p class="muted">${t("enterCodeHint", { name: esc(p.peer_name) })}</p>
      <div class="field" style="margin-top:12px">
        <input id="codeInput" type="text" inputmode="numeric" maxlength="3" placeholder="000"
          style="font:700 28px Consolas;letter-spacing:10px;text-align:center">
      </div>
      ${err}
      <div class="actions" style="justify-content:flex-end;margin-top:14px">
        <button onclick="cancelPair()">${t("cancel")}</button>
        <button class="primary" onclick="submitCode()">${t("confirm")}</button>
      </div>`;
    const input = document.getElementById("codeInput");
    input.focus();
    input.addEventListener("keydown", e => { if (e.key === "Enter") submitCode(); });
  }
}

async function scan() { await api("/api/scan"); toast(t("rescanned")); refresh(); }
async function pair(id) {
  const r = await api("/api/pair", { peer_id: id });
  if (!r.ok) toast(r.error || t("pairFailed"));
  refresh();
}
async function cancelPair() { await api("/api/pair/cancel"); lastPairKey = ""; refresh(); }
async function submitCode() {
  const input = document.getElementById("codeInput");
  if (!input) return;
  const r = await api("/api/pair/code", { code: input.value.trim() });
  if (!r.ok) toast(r.error || t("pairFailed"));
  refresh();
}
async function unpair(id) {
  if (!confirm(t("unpairConfirm"))) return;
  await api("/api/unpair", { peer_id: id });
  refresh();
}
async function connectPeer(id) {
  const edge = document.getElementById("edge").value;
  const r = await api("/api/session/start", { peer_id: id, edge });
  if (!r.ok) toast(r.error || t("connectFailed"));
  refresh();
}
async function stopSession() { await api("/api/session/stop"); toast(t("stopped60")); refresh(); }
async function setAuto(id, enabled) { await api("/api/autoconnect", { peer_id: id, enabled }); refresh(); }
async function saveSettings() {
  const r = await api("/api/settings", {
    edge: document.getElementById("edge").value,
    trigger_px: Number(document.getElementById("triggerPx").value),
    trigger_ms: Number(document.getElementById("triggerMs").value),
    release_px: Number(document.getElementById("releasePx").value),
  });
  toast(r.ok ? t("settingsSaved") : t("saveFailed"));
  refresh();
}
async function togglePause() { await api("/api/settings", { paused: !S.paused }); refresh(); }
async function quitApp() {
  if (!confirm(t("quitConfirm"))) return;
  await api("/api/quit");
  document.body.innerHTML = `<p style="padding:40px;color:#8ba0b8">${t("quitDone")}</p>`;
}
async function collectLogs() {
  toast(t("collecting"));
  const r = await api("/api/logs", {});
  if (r.ok) toast(t("collected") + r.path);
  else toast(r.error || t("collectFailed"));
}

applyI18n();
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
